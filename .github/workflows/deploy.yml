name: Validate, build and deploy to Firebase Hosting

# Firebase Hosting (folur-kaz-platform.web.app) — основной хостинг платформы,
# альтернатива GitHub Pages (репозиторий приватный, Pages недоступен).
# Пока секрет FIREBASE_SERVICE_ACCOUNT не добавлен, workflow работает как CI:
# валидация контента + строгая сборка; деплой-шаг пропускается.
# Секрет: Firebase Console → Project settings → Service accounts →
# Generate new private key → содержимое JSON в секрет репозитория.

on:
  push:
    branches: [main, master]
    paths: ["project/platform/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and validate
        working-directory: project/platform
        run: |
          pip install -r requirements.txt
          python tools/validate_content.py
      - name: Build (strict)
        working-directory: project/platform
        run: mkdocs build --strict
      - name: Deploy to Firebase Hosting (live)
        if: env.HAS_FIREBASE_SA == 'true' && github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: folur-kaz-platform
          entryPoint: project/platform
      - name: Deploy skipped — нет секрета FIREBASE_SERVICE_ACCOUNT
        if: env.HAS_FIREBASE_SA != 'true'
        run: echo "Секрет FIREBASE_SERVICE_ACCOUNT не задан — деплой пропущен. Публикация вручную: project/platform/tools/deploy_firebase.sh"
