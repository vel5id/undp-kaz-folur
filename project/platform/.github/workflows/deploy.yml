name: Validate and build (CI)

# Хостинг — Firebase (https://folur-kaz-platform.web.app/), деплой выполняется
# скриптом tools/deploy_firebase.sh. Этот workflow — контроль качества на push:
# валидация контента и strict-сборка (сломанный контент не пройдёт).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and validate
        run: |
          pip install -r requirements.txt
          python tools/validate_content.py
      - name: Build (strict)
        run: mkdocs build --strict
